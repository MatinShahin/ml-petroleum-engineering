<html lang="en">
<head>
<meta charset="utf-8">

<title>Machine Learning for Petroleum Engineering · AI Innovators</title>

<script src="plotly.min.js"></script>
<style>:root {
  --bg: #EEF2F4; --surface: #FFFFFF; --sunk: #F5F8FA; --ink: #10202B; --muted: #566876; --line: #D3DCE2; --line2: #E4EAEE;
  --petrol: #0B6E79; --petrol-soft: #DCEFF1; --amber: #B36A00; --amber-soft: #FBEBD3; --good: #1D7F47; --bad: #B83227; --warn: #9A6400;
  --plot-grid: #E3E9ED; --code-bg: #0F1E28; --code-ink: #DCE7EE; --shadow: 0 1px 2px rgba(16, 32, 43, .06);
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Consolas, Menlo, monospace;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0C141B; --surface: #131E27; --sunk: #0F1921; --ink: #E2EAF0; --muted: #8C9EAC; --line: #263541; --line2: #1D2A34;
  --petrol: #3DB9C5; --petrol-soft: #123139; --amber: #F2A63C; --amber-soft: #3A2A12; --good: #52C483; --bad: #F2766B; --warn: #E8B54D;
  --plot-grid: #22303B; --code-bg: #091118; --code-ink: #D6E2EA; --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; font: 15px/1.5 var(--sans); color: var(--ink); background: var(--bg); font-variant-numeric: tabular-nums; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--petrol); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- header and tabs ---------- */
.top { display: flex; align-items: flex-end; gap: 24px; padding: 22px 32px 0; max-width: 1560px; margin: 0 auto; }
.brand h1 { margin: 0; font-size: 26px; line-height: 1.15; font-weight: 600; letter-spacing: -.01em; }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.spacer { flex: 1; }
.theme { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
.theme button { border: 0; background: transparent; padding: 5px 14px; border-radius: 999px; cursor: pointer; font-size: 13px; color: var(--muted); }
.theme button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
nav.tabs { display: flex; gap: 2px; padding: 18px 32px 0; max-width: 1560px; margin: 0 auto; border-bottom: 1px solid var(--line); overflow-x: auto; }
nav.tabs button { border: 0; background: transparent; padding: 10px 14px 12px; cursor: pointer; color: var(--muted); font-size: 14.5px; border-bottom: 3px solid transparent; white-space: nowrap; display: flex; gap: 8px; align-items: baseline; }
nav.tabs button b { font-weight: 600; font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; width: 20px; height: 20px; display: inline-grid; place-items: center; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--petrol); font-weight: 600; }
nav.tabs button[aria-selected="true"] b { background: var(--petrol); border-color: var(--petrol); color: var(--surface); }
main { max-width: 1560px; margin: 0 auto; padding: 22px 32px 40px; }
.lab { display: none; } .lab.on { display: block; }
.intro { max-width: 860px; margin-bottom: 18px; }
.intro h2 { margin: 0 0 4px; font-size: 22px; font-weight: 600; letter-spacing: -.005em; }
.intro p { margin: 0; color: var(--muted); }

/* ---------- layout: steps rail + results ---------- */
.grid { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 24px; align-items: start; }
.rail { position: sticky; top: 12px; display: flex; flex-direction: column; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); max-height: calc(100vh - 24px); overflow: auto; }
.step { padding: 16px 18px 18px; border-top: 1px solid var(--line2); position: relative; }
.step:first-child { border-top: 0; }
.step h3 { margin: 0 0 10px; font-size: 15px; font-weight: 600; display: flex; gap: 10px; align-items: center; }
.step h3 .n { flex: none; width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 13px; background: var(--petrol-soft); color: var(--petrol); font-weight: 700; }
.step.done h3 .n { background: var(--petrol); color: var(--surface); }
.step.locked { opacity: .45; pointer-events: none; }
.f { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin: 10px 0; align-items: center; }
.f > label, .f > .lab-t { font-size: 13.5px; color: var(--ink); }
.f output { font-size: 13px; color: var(--petrol); font-weight: 600; }
.f select, .f input[type=range], .f .full { grid-column: 1 / -1; }
.f .hint, .hint { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); margin: 2px 0 0; }
select { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--sunk); }
input[type=range] { width: 100%; accent-color: var(--petrol); }
input[type=checkbox] { accent-color: var(--petrol); width: 15px; height: 15px; }
.check { display: flex; gap: 8px; align-items: center; font-size: 13.5px; margin: 6px 0; cursor: pointer; }
.checks { display: grid; grid-template-columns: 1fr; gap: 0; }
details.more { margin-top: 6px; border-top: 1px dashed var(--line); padding-top: 6px; }
details.more summary { cursor: pointer; font-size: 13px; color: var(--muted); padding: 4px 0; }
.btn { border: 0; border-radius: 9px; padding: 10px 16px; background: var(--petrol); color: #fff; font-weight: 600; cursor: pointer; font-size: 14.5px; }
:root[data-theme="dark"] .btn { color: #071318; }
:root[data-theme="dark"] .btn.ghost, :root[data-theme="dark"] .btn.alt { color: var(--petrol); }
.btn:hover { filter: brightness(1.08); } .btn:disabled { opacity: .5; cursor: wait; }
.btn.wide { width: 100%; margin-top: 6px; }
.btn.ghost { background: transparent; color: var(--petrol); border: 1px solid var(--petrol); }
.btn.sm { padding: 5px 10px; font-size: 12.5px; border-radius: 7px; font-weight: 600; }
.btn.alt { background: transparent; color: var(--petrol); border: 1px solid var(--line); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.prog { height: 3px; background: var(--line2); border-radius: 2px; overflow: hidden; margin-top: 10px; }
.prog i { display: block; height: 100%; width: 0; background: var(--amber); transition: width .15s; }
.task { margin: 0; padding: 14px 18px 16px; background: var(--sunk); border-top: 1px solid var(--line2); font-size: 13.5px; }
.task b { display: block; margin-bottom: 4px; font-size: 13px; }
.task ol { margin: 0; padding-left: 18px; color: var(--muted); } .task li { margin: 3px 0; }

/* ---------- results ---------- */
.results { min-width: 0; display: flex; flex-direction: column; gap: 18px; }
.empty { border: 1.5px dashed var(--line); border-radius: 12px; padding: 48px 32px; text-align: center; color: var(--muted); background: transparent; }
.empty h3 { margin: 0 0 6px; color: var(--ink); font-weight: 600; font-size: 18px; }
.empty p { margin: 0 auto; max-width: 520px; }
.empty .ghost-charts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 28px; opacity: .55; }
.empty .ghost-charts div { height: 140px; border-radius: 10px; background: repeating-linear-gradient(0deg, var(--line2) 0 1px, transparent 1px 28px); border: 1px solid var(--line2); }
.stale { display: flex; gap: 12px; align-items: center; padding: 10px 14px; border-radius: 10px; background: var(--amber-soft); color: var(--ink); font-size: 14px; }
.stale .btn { margin-left: auto; }
.res-body.dim { opacity: .55; transition: opacity .2s; }
.res-body { display: flex; flex-direction: column; gap: 18px; }
.metrics { display: flex; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.m { padding: 12px 18px; border-left: 1px solid var(--line2); min-width: 120px; flex: 1 1 120px; }
.m:first-child { border-left: 0; }
.m .v { font-size: 24px; font-weight: 600; line-height: 1.2; }
.m .l { font-size: 12.5px; color: var(--muted); }
.m.train .v { color: var(--petrol); } .m.test .v { color: var(--amber); } .m.good .v { color: var(--good); } .m.bad .v { color: var(--bad); } .m.warn .v { color: var(--warn); }
.meaning { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--petrol); border-radius: 10px; padding: 14px 18px; box-shadow: var(--shadow); }
.meaning h3 { margin: 0 0 6px; font-size: 15px; }
.meaning ul { margin: 0; padding-left: 18px; } .meaning li { margin: 4px 0; }
.meaning li.w::marker { color: var(--amber); } .meaning li.b::marker { color: var(--bad); } .meaning li.g::marker { color: var(--good); }
.charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow); min-width: 0; }
.card.span { grid-column: 1 / -1; }
.card h3 { margin: 0; font-size: 15.5px; font-weight: 600; }
.card .read { margin: 2px 0 6px; font-size: 13px; color: var(--muted); }
.plot { height: 330px; } .plot.tall { height: 400px; } .plot.short { height: 250px; } .plot.xl { height: 560px; } .plot.auto { height: auto; min-height: 300px; }
.algbtns { margin: 6px 0 10px; } .algbtns .btn { font-size: 12.5px; }
.scroll { overflow: auto; max-height: 360px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: right; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); }
td { text-align: right; padding: 5px 8px; border-bottom: 1px solid var(--line2); }
th:first-child, td:first-child { text-align: left; }
.ok { color: var(--good); } .no { color: var(--bad); }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); margin: 1px 2px; }
.pill.ok { border-color: var(--good); } .pill.no { border-color: var(--bad); }
.note { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
.toast { font-size: 13px; color: var(--good); min-height: 18px; margin-top: 6px; }
code { font-family: var(--mono); font-size: .92em; }

/* data & code panel */
.dc { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow); }
.dc-head { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
.dc-head h3 { margin: 0 6px 0 0; font-size: 15.5px; }
.dc-tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.dc-b { font-weight: 600; font-size: 13px; padding: 6px 12px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.dc-b[aria-selected="true"] { background: var(--petrol); color: var(--surface); }
.dc-sp { flex: 1; } .dc-sel { width: auto; font-size: 13px; padding: 5px 8px; }
.dc-note { font-size: 12.5px; color: var(--muted); margin: 8px 0 6px; }
.dc-table { overflow: auto; max-height: 320px; border: 1px solid var(--line2); border-radius: 8px; }
.dc-table table { font-size: 12.5px; } .dc-table td, .dc-table th { white-space: nowrap; }
.dc-code { margin: 0; max-height: 440px; overflow: auto; background: var(--code-bg); color: var(--code-ink); border-radius: 8px; padding: 14px 16px; font: 12.5px/1.55 var(--mono); white-space: pre; }
.dc-toast { font-size: 12.5px; color: var(--good); min-height: 16px; margin-top: 6px; }
footer { max-width: 1560px; margin: 0 auto; padding: 0 32px 32px; color: var(--muted); font-size: 12.5px; }

@media (max-width: 1100px) { .grid { grid-template-columns: 1fr; } .rail { position: static; max-height: none; } .charts { grid-template-columns: 1fr; } }
@media (max-width: 640px) { .top, nav.tabs, main { padding-left: 14px; padding-right: 14px; } .top { flex-wrap: wrap; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ---------- workflow stepper ---------- */
.stepper { display: grid; grid-template-columns: repeat(var(--n, 6), minmax(0, 1fr)); gap: 0; margin: 0 0 20px; counter-reset: s; }
.stepper button { position: relative; border: 0; background: transparent; padding: 0 6px 0 0; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 6px; color: var(--muted); }
.stepper button::before { content: ""; position: absolute; top: 14px; left: 30px; right: 4px; height: 2px; background: var(--line); }
.stepper button:last-child::before { display: none; }
.stepper button.done::before { background: var(--petrol); }
.stepper .dot { position: relative; z-index: 1; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; background: var(--surface); border: 2px solid var(--line); color: var(--muted); }
.stepper .t { font-size: 13.5px; line-height: 1.3; padding-right: 10px; }
.stepper button.done .dot { background: var(--petrol); border-color: var(--petrol); color: var(--surface); }
.stepper button.open .dot { border-color: var(--petrol); color: var(--petrol); }
.stepper button.cur .dot { box-shadow: 0 0 0 4px var(--petrol-soft); }
.stepper button.cur .t { color: var(--ink); font-weight: 600; }
.stepper button.stale .dot { border-color: var(--amber); color: var(--amber); background: var(--surface); }
.stepper button:disabled { cursor: not-allowed; opacity: .55; }
.stage-title { font-size: 13px; color: var(--muted); margin: 0 0 4px; }
.step p.what { margin: -4px 0 10px; font-size: 13px; color: var(--muted); }
.nextbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 4px 0; }
.nextbar .note { margin: 0; }
.src-toggle { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; margin-bottom: 8px; }
.src-toggle button { border: 0; padding: 8px; background: transparent; cursor: pointer; font-size: 13.5px; color: var(--muted); }
.src-toggle button[aria-pressed="true"] { background: var(--petrol-soft); color: var(--petrol); font-weight: 600; }
.decision { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 8px 0; background: var(--sunk); }
.decision .check { margin: 0; font-weight: 600; }
.decision p { margin: 4px 0 0 23px; font-size: 12.5px; color: var(--muted); }
.cmp-table td.best { font-weight: 700; color: var(--petrol); }
@media (max-width: 900px) { .stepper { grid-template-columns: repeat(3, 1fr); row-gap: 14px; } }
.rngtab { width: 100%; margin: 4px 0 8px; } .rngtab td { padding: 3px 4px; border: 0; text-align: left; } .rngtab td:first-child { font-size: 13px; }
.rngtab input[type=number] { width: 72px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--sunk); }

/* ---------- branding ---------- */
.top { align-items: center; }
.brandrow { display: flex; align-items: center; gap: 18px; }
.brandrow .sep { width: 1px; height: 40px; background: var(--line); }
.credit { text-align: right; font-size: 13px; color: var(--muted); line-height: 1.35; }
.credit b { color: var(--ink); font-weight: 600; }
footer .fcredit { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 14px; }
/* ---------- the case ---------- */
.case { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.case .card h3 { margin-bottom: 6px; } .case .card p, .case .card li { font-size: 14px; } .case .card ul { padding-left: 18px; margin: 6px 0 0; }
.case .card.problem { border-top: 3px solid var(--bad); } .case .card.solution { border-top: 3px solid var(--petrol); } .case .card.data { border-top: 3px solid var(--amber); }
.flow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.flow span { padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; background: var(--sunk); }
.flow i { color: var(--muted); font-style: normal; }
.kv { width: 100%; } .kv td { text-align: left; vertical-align: top; } .kv td:first-child { color: var(--muted); white-space: nowrap; width: 34%; }
.refs li { margin: 6px 0; font-size: 13.5px; }
.explain { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.explain div { background: var(--sunk); border: 1px solid var(--line2); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; }
.explain b { display: block; margin-bottom: 3px; }
.formula { font-family: var(--mono); font-size: 13px; background: var(--sunk); border: 1px solid var(--line2); border-radius: 8px; padding: 8px 10px; margin: 6px 0; overflow-x: auto; }
@media (max-width: 1100px) { .case, .explain { grid-template-columns: 1fr; } }
details.casebox { margin: 0 0 22px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
details.casebox > summary { cursor: pointer; padding: 14px 18px; font-weight: 600; font-size: 15.5px; list-style: none; display: flex; align-items: center; gap: 10px; }
details.casebox > summary::-webkit-details-marker { display: none; }
details.casebox > summary::before { content: "▸"; color: var(--petrol); transition: transform .15s; } details.casebox[open] > summary::before { transform: rotate(90deg); }
details.casebox > summary::after { content: "hide"; margin-left: auto; font-size: 12.5px; font-weight: 400; color: var(--muted); } details.casebox:not([open]) > summary::after { content: "show"; }
.casebody { padding: 0 18px 18px; display: flex; flex-direction: column; gap: 16px; }
.casebody .card { box-shadow: none; background: var(--sunk); }
.logo { height: 62px; width: auto; display: block; flex: none; }
.logo.d { display: none; } :root[data-theme="dark"] .logo.l { display: none; } :root[data-theme="dark"] .logo.d { display: block; }
.brand h1 { white-space: nowrap; } .credit { white-space: nowrap; }
@media (max-width: 900px) { .credit { display: none; } .logo { height: 36px; } }
.casepick { display: flex; flex-wrap: wrap; gap: 8px; }
.casepick button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-size: 13.5px; font-weight: 500; }
.casepick button[aria-pressed="true"] { background: var(--petrol); border-color: var(--petrol); color: var(--surface); }

function makeScaler(X) { const d = X[0].length, n = X.length, mu = new Array(d).fill(0), sd = new Array(d).fill(0);

function solveLin(A, b) { const n = b.length, M = A.map((r, i) => [...r, b[i]]);

    const d = M[c][c] || 1e-12; for (let r = 0; r < n; r++) if (r !== c) { const f = M[r][c] / d; if (f) for (let k = c; k <= n; k++) M[r][k] -= f * M[c][k]; } }
  return M.map((r, i) => r[n] / (r[i] || 1e-12)); }

class LinearModel { // ordinary least squares (degree 1) or polynomial degree 2, small ridge for stability
  constructor(o = {}) { this.degree = o.degree || 1; this.alpha = o.alpha ?? 1e-6; }

    F.forEach((f, i) => { for (let a = 0; a < p; a++) { b[a] += f[a] * y[i]; for (let c = a; c < p; c++) A[a][c] += f[a] * f[c]; } });

}

class KNNModel {

  else s.raw = (k === "asph" ? D.asph : D.vfm).map(r => ({ ...r }));
  if (k === "asph") s.raw.forEach(r => { r.series = `${r.temperature_K}K C${r.alkane_carbon_number}`; if (r.suspect === undefined) r.suspect = "normal"; }); }

function genPyReg(o) { if (o.k === "vfm") return `from aiml.generators import make_vfm_data

                          outlier_factor=(${py(.8 * o.fac)}, ${py(1.2 * o.fac)}), seed=${o.seed})

// ---------- python, cumulative per step ----------
function pyReg(k, upto) { const eda = upto === "eda"; if (eda) upto = 0; const s = S[k], c = REGCFG[k], out = [`# ${k === "asph" ? "Asphaltene precipitation" : "Virtual flow metering"}: the workflow up to step ${eda ? 2 : upto === 0 ? 1 : upto + 2}  (Part I, ${k === "asph" ? "Lab 1" : "Lab 3"})`, KIT1, PYIMP];
  out.push(`\n# ---- Step 1 · get the data ----`, s.gen ? genPyReg(s.gen) : k === "asph" ? `from aiml.data import load_asphaltene\ndf = load_asphaltene()                 # adds 'series' and 'suspect'` : `from aiml.data import load_vfm\ndf = load_vfm()                        # adds 'case_id': the copies of one well test share it`,
    `TARGETS = ${py(c.targets)}`, `print(df.shape); print(df.head())`);
  if ((eda || upto >= 1) && s.eda) out.push(pyEda(k));
  if (upto >= 1 && s.dec) { const d = s.dec; out.push(`\n# ---- Step 3 · clean ----`, `from aiml.prep import detect_outliers_iqr, outlier_table`, `print(outlier_table(df, threshold=${py(d.k)}))`, `drop = set()`);

    if (d.iqr) out.push(`for t in TARGETS:\n    drop |= set(detect_outliers_iqr(df, t, threshold=${py(d.k)})[2])`);
    out.push(`clean = df.drop(index=list(drop))`);
    if (d.dedupe) out.push(`clean = clean.drop_duplicates(subset="case_id")       # one row per well test`);
    out.push(`clean = clean.reset_index(drop=True)`);
    if (d.logdr) out.push(`clean["log_dilution"] = np.log(clean.dilution_ratio)`);
    if (d.invt) out.push(`clean["inv_temperature"] = 1000 / clean.temperature_K`);
    out.push(`print(len(df), "rows ->", len(clean), "after cleaning")`); }
  if (upto >= 2 && s.split) { const p = s.split; out.push(`\n# ---- Step 4 · split ----`);
    if (p.method === "random") out.push(`_, te = train_test_split(np.arange(len(clean)), test_size=${py(p.share)}, random_state=${p.seed})\ntest = np.isin(np.arange(len(clean)), te)`);
    else if (p.method === "group") out.push(`groups = clean[${py(k === "asph" ? "series" : "case_id")}]\n_, te = next(GroupShuffleSplit(n_splits=1, test_size=${py(p.share)}, random_state=${p.seed}).split(clean, groups=groups))\ntest = np.isin(np.arange(len(clean)), te)`);
    else out.push(`test = (clean[${py(p.col)}] == ${p.val}).values      # hold out one value`);
    out.push(`train = clean[~test]`, `print(len(train), "train rows,", test.sum(), "test rows")`);
    if (k === "vfm") out.push(`gauges_and_rates = ["choke_in", "bhp_psi", "whp_psi", "wht_F", "tsep_F"] + TARGETS\nleak = clean[test].merge(train[gauges_and_rates].drop_duplicates(), on=gauges_and_rates).shape[0]\nprint("test rows whose well test is also in training:", leak)`); }

      `for name in ${py(m.compared.map(a => AIML[a]))}:\n    sc = cross_val_score(regressors()[name], train[INPUTS], train[TARGETS[0]], cv=cv, groups=cv_groups, scoring="r2")\n    print(f"{name:<28} CV R2 {sc.mean():.3f} ± {sc.std():.3f}   folds: {np.round(sc, 3)}")`,
      ...(m.sel && m.cv.some(r => r.alg === m.sel) ? [`# results of one algorithm: ${ALGN[m.sel]}, every training row predicted by the model trained without it

      `${pyShapNote}\nimport shap\nbg = train[INPUTS].sample(min(50, len(train)), random_state=0)\nX_explain = clean[test][INPUTS].iloc[:150]\nt = ${py(s.ev.shapT || c.targets[0])}\nexplainer = shap.Explainer(lambda X: models[t].predict(pd.DataFrame(X, columns=INPUTS)), bg)\nsv = explainer(X_explain)\nshap.plots.beeswarm(sv, max_display=len(INPUTS))\nshap.plots.bar(sv, max_display=len(INPUTS))\ntop = INPUTS[int(np.abs(sv.values).mean(0).argmax())]\nshap.plots.scatter(sv[:, top], color=sv)`); }

function pyNote(upto) { return `The Python script for steps 1 to ${upto + 1}, with the settings on this page. ${upto === 6 ? "This is the complete workflow." : "Each step adds to the script of the step before."} Browser models are small versions of the scikit-learn ones, so numbers are close, not identical.`; }

// ---------- step 2 · explore and clean ----------
function regCleanControls(k) { return (k === "asph"
  ? decision("asph-d-suspect", "Remove the 17 suspect tests", "332 K with n-C6, C7 and C8: about ten times higher than every other series. Only for the course data.", false)
    + decision("asph-d-iqr", "Remove IQR outliers of the target", "Drops every test outside the IQR fences below.", false)
    + decision("asph-d-logdr", "Add log(dilution ratio) as an input", "Precipitation grows roughly with the log of dilution; a straight-line model cannot bend by itself.", false)
    + decision("asph-d-invt", "Add 1000/temperature as an input", "The form temperature takes in solubility equations.", false)
  : decision("vfm-d-dedupe", "Keep one row per well test", "Drops the copies of each test at other separator pressures (the rates do not change with Psep).", false)
    + decision("vfm-d-iqr", "Remove IQR outliers of the rates", "", false))
  + rangeCtl(`${k}-d-k`, "IQR multiplier k", 1, 3, .1, 1.5, "Flag below Q1 − k·IQR or above Q3 + k·IQR."); }
function regCleanInit(k) { bind(`${k}-d-k`, v => v.toFixed(1)); }
function regCleanOnEnter(k) { if (k === "asph" && S.asph && $("asph-d-suspect")) { const g = !!S.asph.gen; $("asph-d-suspect").disabled = g; if (g) $("asph-d-suspect").checked = false; } }
function regCleanRun(k) { const s = S[k], c = REGCFG[k], R = s.raw, kk = +$(`${k}-d-k`).value;
  const d = { k: kk, suspect: k === "asph" && $("asph-d-suspect").checked && !s.gen, iqr: $(`${k}-d-iqr`).checked, logdr: k === "asph" && $("asph-d-logdr").checked, invt: k === "asph" && $("asph-d-invt").checked, dedupe: k === "vfm" && $("vfm-d-dedupe").checked };
  const fences = {}, flag = R.map(() => false); c.targets.forEach(t => { const [lo, hi] = iqr(R.map(r => r[t]), kk); fences[t] = [lo, hi]; R.forEach((r, i) => { if (r[t] < lo || r[t] > hi) flag[i] = true; }); });
  const why = R.map((r, i) => d.suspect && r.suspect === "suspect" ? "suspect series" : d.iqr && flag[i] ? "IQR outlier" : "");
  let keep = R.filter((_, i) => !why[i]), dup = 0;
  if (d.dedupe) { const seen = new Set(); keep = keep.filter(r => { if (seen.has(r.case_id)) { dup++; return false; } seen.add(r.case_id); return true; }); }
  s.dec = d; s.flag = flag; s.fences = fences; s.removed = R.map((r, i) => ({ ...r, removed_because: why[i] })).filter(r => r.removed_because); s.clean = keep; s.dupDropped = dup;
  s.feats = [...c.base, ...(d.logdr ? ["log_dilution"] : []), ...(d.invt ? ["inv_temperature"] : [])]; }
function regCleanRender(k) { const s = S[k], c = REGCFG[k], R = s.raw, d = s.dec, t0 = c.targets[0], nflag = s.flag.filter(Boolean).length;
  const tests = new Set(R.map(r => r.case_id ?? r.series + r.dilution_ratio)).size;
  $(`${k}-met2`).innerHTML = met(R.length, "rows before") + met(nflag, `IQR flags (k = ${d.k})`, nflag ? "warn" : "") + (k === "vfm" ? met(tests.toLocaleString(), "different well tests", tests < R.length ? "warn" : "") : met(R.filter(r => r.suspect === "suspect").length, "suspect tests", "warn"))
    + met(R.length - s.clean.length, "rows removed") + met(s.clean.length, "rows kept", "train") + met(s.feats.length, "inputs available");
  const items = [];
  if (k === "asph") { const bySer = {}; R.forEach((r, i) => { if (s.flag[i]) bySer[r.series] = (bySer[r.series] || 0) + 1; });
    const top = Object.entries(bySer).sort((a, b) => b[1] - a[1]).slice(0, 4).map(([a, b]) => `${a} (${b})`).join(", ");
    items.push(nflag ? ["w", `The IQR rule flags ${nflag} tests${top ? `, mostly in ${top}` : ""}. ${s.gen ? `The generator planted ${R.filter(r => r.is_outlier).length}; it caught ${R.filter((r, i) => r.is_outlier && s.flag[i]).length}.` : "They are not random spikes: they are whole curves, which points to a different oil, unit or procedure rather than noise."}`] : "No test is outside the IQR fences.");
    if (!s.gen) items.push(d.suspect ? ["g", "The 17 suspect tests are removed. Compare step 4 with and without them: it changes which model wins."] : ["w", "The 17 suspect tests are still in. Flexible models will chase them; straight-line models will fail."]);
    items.push(d.logdr ? ["g", "log_dilution is now an input. Linear models gain the most from it."] : "Try adding log(dilution): the curves bend like a logarithm."); }
  else { items.push(["w", `${R.length.toLocaleString()} rows hold only ${tests.toLocaleString()} different well tests. Each test is repeated for ${Math.round(R.length / tests)} separator pressures with the same rates, so separator pressure has no effect (left chart).`]);
    items.push(d.dedupe ? ["g", `Kept one row per test (${s.dupDropped.toLocaleString()} copies dropped). A random split can no longer put copies on both sides.`] : ["w", "Copies are kept. In step 3, split by well test, or a random split will test the model on rows it has already seen."]);
    items.push(nflag ? `IQR flags ${nflag} rows: wide ranges by design (ten chokes, water cut up to 0.8), not errors. Removing them would delete real high-rate tests.` : "No rate is outside the IQR fences: wide ranges here are by design, not errors."); }
  $(`${k}-mean2`).innerHTML = meaning("What the check found", items);
  if (k === "asph") { const rem = new Set(s.removed.map(r => r.series + "|" + r.dilution_ratio)), kept = R.filter(r => !rem.has(r.series + "|" + r.dilution_ratio)), gone = R.filter(r => rem.has(r.series + "|" + r.dilution_ratio)), fl = R.filter((_, i) => s.flag[i]);
    Plotly.react("asph-clean-sc", [{ x: kept.map(r => r.dilution_ratio), y: kept.map(r => r.asphaltene_wt_pct), mode: "markers", type: "scatter", name: "kept", marker: { size: 6, color: TR() } },
      { x: gone.map(r => r.dilution_ratio), y: gone.map(r => r.asphaltene_wt_pct), mode: "markers", type: "scatter", name: "removed", marker: { size: 8, symbol: "x", color: css("--bad") } },
      { x: fl.map(r => r.dilution_ratio), y: fl.map(r => r.asphaltene_wt_pct), mode: "markers", type: "scatter", name: "IQR flag", marker: { size: 13, color: "rgba(0,0,0,0)", line: { color: TE(), width: 2 } } }],

const CALG = { knn: "K-nearest neighbours", tree: "Decision tree", rf: "Random forest", nn: "Neural network (MLP)" };
const CDEF = { knn: { k: 5 }, tree: { depth: 6, leaf: 1 }, rf: { trees: 200, depth: 15, leaf: 1 }, nn: { hidden: 24, epochs: 300, lr: .01, alpha: .0001 } };
const SHORT = ["CO2", "Comb.", "HC gas", "N2", "Polymer", "Steam"];
const lgF = f => f === "permeability_md" ? "log_permeability" : f === "viscosity_cp" ? "log_viscosity" : f;
const eX = (F, lg) => r => F.map(f => lg && (f === "permeability_md" || f === "viscosity_cp") ? Math.log10(Math.max(r[f], .1)) : r[f]);
function cModel(alg, h, seed) { return alg === "rf" ? new ForestModel({ nTrees: h.trees, maxDepth: h.depth, minLeaf: h.leaf, task: "clf", seed: seed + 7 }) : makeModel(alg, h, "clf", seed, 6); }
const cPy = (alg, h, bal) => { const cw = bal ? `, class_weight="balanced"` : ""; return alg === "knn" ? `make_pipeline(StandardScaler(), KNeighborsClassifier(n_neighbors=${h.k}, weights="distance"))` : alg === "tree" ? `DecisionTreeClassifier(max_depth=${h.depth}, min_samples_leaf=${h.leaf}${cw}, random_state=0)`
  : alg === "rf" ? `RandomForestClassifier(n_estimators=${h.trees}, max_depth=${h.depth}, min_samples_leaf=${h.leaf}, max_features="sqrt"${cw}, random_state=0)` : `make_pipeline(StandardScaler(), MLPClassifier(hidden_layer_sizes=(${h.hidden},), activation="tanh", alpha=${py(h.alpha)}, learning_rate_init=${py(h.lr)}, max_iter=${h.epochs}, batch_size=32, random_state=0))`; };
const CHP = { knn: [["k", "Neighbours k", 1, 30, 1]], tree: [["depth", "Max depth", 1, 16, 1], ["leaf", "Min samples per leaf", 1, 20, 1]], rf: [["trees", "Trees", 10, 400, 10], ["depth", "Max depth", 2, 25, 1], ["leaf", "Min samples per leaf", 1, 10, 1]], nn: HP.nn.map(q => q.slice(0, 5)) };

function pyEor(upto) { const eda = upto === "eda"; if (eda) upto = 0; const s = S.eor, out = [`# EOR screening: the workflow up to step ${eda ? 2 : upto === 0 ? 1 : upto + 2}  (Part I, Lab 2)`, KIT1, `from sklearn.model_selection import train_test_split, StratifiedKFold, cross_val_score
from sklearn.pipeline import make_pipeline
from sklearn.preprocessing import StandardScaler
from sklearn.neighbors import KNeighborsClassifier
from sklearn.tree import DecisionTreeClassifier
from sklearn.ensemble import RandomForestClassifier
from sklearn.neural_network import MLPClassifier
from sklearn.metrics import classification_report
from aiml.generators import taber_screen`];
  out.push(`\n# ---- Step 1 · get the data ----`, s.gen ? `from aiml.generators import make_eor_data\ndf = make_eor_data(n=${s.gen.n}, noise=${py(s.gen.noise)}, label=${py(s.gen.label)}, seed=${s.gen.seed})` : `from aiml.data import load_eor\ndf = load_eor()`, `print(df.eor_method.value_counts())`);
  if ((eda || upto >= 1) && s.eda) out.push(pyEda("eor"));
  if (upto >= 1 && s.dec) { const d = s.dec; out.push(`\n# ---- Step 3 · clean ----`, `print("viscosity = 0:", (df.viscosity_cp == 0).sum(), " temperature < 40 F:", (df.temperature_F < 40).sum(), " duplicates:", df.duplicated(subset=df.columns[2:]).sum())`, `clean = df.copy()`);
    if (d.impossible) out.push(`clean = clean[(clean.viscosity_cp > 0) & (clean.temperature_F >= 40)]      # not physical`);
    if (d.dupes) out.push(`clean = clean.drop_duplicates(subset=[c for c in clean.columns if c not in ("project_id", "country")])`);
    out.push(`clean = clean.reset_index(drop=True)`);
    if (d.log) out.push(`clean["log_viscosity"] = np.log10(clean.viscosity_cp.clip(lower=0.1))\nclean["log_permeability"] = np.log10(clean.permeability_md.clip(lower=0.1))`); }
  if (upto >= 2 && s.split) { const p = s.split; out.push(`\n# ---- Step 4 · split ----`, `tr, te = train_test_split(clean.index, test_size=${py(p.share)}, random_state=${p.seed}${p.strat ? ", stratify=clean.eor_method" : ""})`, `train, test = clean.loc[tr], clean.loc[te]`, `print(pd.DataFrame({"train": train.eor_method.value_counts(), "test": test.eor_method.value_counts()}))`); }
  if (upto >= 3 && s.model) { const m = s.model; out.push(`\n# ---- Step 5 · compare with cross-validation, then train the final model ----`, `INPUTS = ${py(m.inputs.map(f => s.dec.log ? lgF(f) : f))}`,
      `candidates = {\n${m.cv.filter(r => r.alg !== "taber").map(r => `    ${py(CALG[r.alg])}: ${cPy(r.alg, r.h, false)},`).join("\n")}\n}`,
      `cv = StratifiedKFold(${m.K}, shuffle=True, random_state=0)          # k = ${m.K} folds\nfor name, model in candidates.items():\n    sc = cross_val_score(model, train[INPUTS], train.eor_method, cv=cv, scoring="f1_macro")\n    print(f"{name:<24} macro F1 {sc.mean():.3f} ± {sc.std():.3f}   folds: {np.round(sc, 3)}")`,
      ...(m.sel && m.sel !== "taber" ? [`# results of one algorithm: ${CALG[m.sel]}, every training project predicted by the model trained without it\nfrom sklearn.model_selection import cross_val_predict\nfrom aiml.data import EOR_CLASSES\nfrom aiml.evaluate import confusion\noof = cross_val_predict(candidates[${py(CALG[m.sel])}], train[INPUTS], train.eor_method, cv=cv)\nprint(classification_report(train.eor_method, oof, zero_division=0))\nconfusion(train.eor_method, oof, EOR_CLASSES, title=${py(CALG[m.sel] + " · out-of-fold")}); plt.show()`] : []),
      `print("Taber rules on the training rows:", (taber_screen(train) == train.eor_method).mean().round(3), "accuracy")`, `final = ${cPy(m.alg, m.h, m.bal)}`, `final.fit(train[INPUTS], train.eor_method)`); }
  if (upto >= 4 && s.ev) out.push(`\n# ---- Step 6 · evaluate once on the test set ----`, `from aiml.data import EOR_CLASSES\nfrom aiml.evaluate import confusion, classification_metrics, importance`, `p = final.predict(test[INPUTS]); t = taber_screen(test)`, `print(classification_report(test.eor_method, p, zero_division=0))`,
    `print("model:", {k: round(v, 3) for k, v in classification_metrics(test.eor_method, p).items()})\nprint("Taber:", {k: round(v, 3) for k, v in classification_metrics(test.eor_method, t).items()})`, `fig, ax = plt.subplots(1, 2, figsize=(14, 5.5))\nconfusion(test.eor_method, p, EOR_CLASSES, ax=ax[0], title="model · test")\nimportance(final, test[INPUTS], test.eor_method, ax=ax[1]); plt.tight_layout(); plt.show()`,
    `${pyShapNote}\nimport shap\ncls = ${py(s.ev.shapC || CLASSES[0])}; k = list(final.classes_).index(cls)\nbg = train[INPUTS].sample(min(50, len(train)), random_state=0)\nexplainer = shap.Explainer(lambda X: final.predict_proba(pd.DataFrame(X, columns=INPUTS))[:, k], bg)\nsv = explainer(test[INPUTS].iloc[:150])\nshap.plots.beeswarm(sv, max_display=len(INPUTS)); shap.plots.bar(sv, max_display=len(INPUTS))   # SHAP for the probability of the chosen method`);
  if (upto >= 5 && s.use) { const f = s.use.f; out.push(`\n# ---- Step 7 · screen a new field ----`, `new = pd.DataFrame([${"{"}${EOR_F.map(q => `"${q}": ${py(+f[q].toFixed(3))}`).join(", ")}${"}"}])`, `new["log_viscosity"] = np.log10(new.viscosity_cp.clip(lower=0.1)); new["log_permeability"] = np.log10(new.permeability_md.clip(lower=0.1))`,
      `print("model:", final.predict(new[INPUTS])[0], "| Taber rules:", taber_screen(new)[0])\nprint(pd.Series(final.predict_proba(new[INPUTS])[0], final.classes_).sort_values(ascending=False).round(3))`); }
  return out.join("\n"); }

  Plotly.react("eor-cm", [{ z, x: SHORT, y: SHORT, type: "heatmap", colorscale: scale, showscale: false, text: z.map(r => r.map(v => norm ? v.toFixed(2) : v)), texttemplate: "%{text}", textfont: { color: css("--ink") }, hovertemplate: "true %{y} → predicted %{x}: %{text}<extra></extra>", xgap: 2, ygap: 2 }],
    layout({ margin: { l: 70, r: 10, t: 8, b: 60 }, xaxis: { title: { text: "predicted" } }, yaxis: { title: { text: "true" }, autorange: "reversed" } }), CFG); }
function eorLive() { PROJ.eor.stages[6].run("eor"); PROJ.eor.stages[6].render("eor"); $("eor-stale6").hidden = true; $("eor-res6").classList.remove("dim"); dcRefresh("dc-eor-6"); }
function stratSplit(y, share, rng) { const te = new Array(y.length).fill(false); CLASSES.forEach((_, k) => { const ix = y.map((v, i) => v === k ? i : -1).filter(i => i >= 0), s = shuffleIdx(ix.length, rng); const nt = ix.length >= 2 ? Math.max(1, Math.round(share * ix.length)) : 0; s.slice(0, nt).forEach(j => te[ix[j]] = true); }); return te; }

const mode = a => { const c = {}; a.forEach(v => c[v] = (c[v] || 0) + 1); return +Object.entries(c).sort((x, y) => y[1] - x[1])[0][0]; };
function eorAlgDraw() { const s = S.eor, m = s.model; if (!m) return; const names = { ...CALG, taber: "Taber rules (no training)" }, r = m.cv.find(q => q.alg === m.sel) || m.cv[0];
  algButtons("eor", m.cv, r.alg, names); foldLines("eor-cvfold", m.cv.filter(q => q.alg !== "taber"), r.alg, CALG, "macro F1 of the fold");
  $("eor-algmet").innerHTML = met(r.mean.toFixed(3), r.folds.length ? `CV macro F1 (mean of ${r.folds.length})` : "macro F1 on training projects", r2c(r.mean)) + (r.folds.length ? met("± " + r.sd.toFixed(3), "spread between folds", r.sd > .08 ? "warn" : "") : "") + met(r.M.accuracy.toFixed(3), "accuracy") + met(r.M.f1_weighted.toFixed(3), "weighted F1") + (r.folds.length ? met(msec(r.sec), `time for ${r.folds.length} fits`) : "");
  const per = r.M.per.map((c, q) => ({ q, ...c })).filter(c => c.support), wk = per.reduce((a, b) => b.recall < a.recall ? b : a);
  $("eor-algnote").innerHTML = `<b>${names[r.alg]}</b>${r.folds.length ? `: fold scores ${r.folds.map(v => v.toFixed(3)).join(", ")}` : ": fixed rules, no training"}. Weakest method: ${CLASSES[wk.q]} (recall ${wk.recall.toFixed(2)}).${r.alg === m.alg ? " This is the final model." : ""}`;
  $("eor-algfinal").hidden = r.alg === m.alg || r.alg === "taber";
  const dark = document.documentElement.dataset.theme === "dark", z = r.M.cm.map(rw => { const t = rw.reduce((a, b) => a + b, 0) || 1; return rw.map(v => v / t); });
  Plotly.react("eor-algcm", [{ z, x: SHORT, y: SHORT, type: "heatmap", zmin: 0, zmax: 1, colorscale: dark ? [[0, "#131E27"], [1, "#3DB9C5"]] : [[0, "#FFFFFF"], [1, "#0B6E79"]], showscale: false, text: r.M.cm.map(rw => rw.map(String)), texttemplate: "%{text}", hovertemplate: "true %{y} → %{x}: %{text}<extra></extra>", xgap: 2, ygap: 2 }],
    layout({ margin: { l: 70, r: 10, t: 8, b: 60 }, xaxis: { title: { text: "predicted" } }, yaxis: { title: { text: "true" }, autorange: "reversed" } }), CFG);
  $("eor-algcm-read").textContent = `${names[r.alg]}: every training project ${r.folds.length ? "predicted by the model trained without its fold" : "screened by the rules"}. Counts; shading is recall per row.`;
  dcRefresh("dc-eor-4"); }
function eorShapDraw() { const s = S.eor, e = s.ev; if (!e || !e.shap) return; $("eor-shap-t").value = e.shapC; const q = CLASSES.indexOf(e.shapC), phi = shapPick(e.shap, q), nm = s.model.inputs.map(f => s.dec.log ? lgF(f) : f);
  const imp = drawBeeswarm("eor-shap-bee", phi, e.shapX, nm); drawShapBar("eor-shap-bar", imp, nm, "probability"); const [top, col] = drawShapDep("eor-shap-dep", phi, e.shapX, nm, imp);
  $("eor-shap-dep-read").textContent = `How ${top} pushes the probability of ${e.shapC}${col ? `; colour is ${col}` : ""}.`;
  const ord = imp.map((v, j) => [nm[j], v]).sort((a, b) => b[1] - a[1]);
  $("eor-shap-note").innerHTML = `Average probability of ${e.shapC}: ${(100 * e.shap.base[q]).toFixed(0)} %. Each dot is one test project: how much one input raised (right) or lowered (left) the probability of ${e.shapC}. Largest average push: <b>${ord[0][0]}</b>${ord[1] ? `, then ${ord[1][0]}` : ""}.`;
  dcRefresh("dc-eor-5"); }


initTheme();
buildProject(regProject("asph")); buildProject(eorProject()); buildProject(regProject("vfm"));
document.addEventListener("change", e => { if (e.target && e.target.id === "eor-cmn") drawEorCM(); });
RENDER.add(() => S.eor && S.eor.ev && W.eor.ran[5] && drawEorCM());
function show(lab) { document.querySelectorAll(".lab").forEach(s => s.classList.toggle("on", s.id === "lab-" + lab)); document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.lab === lab)); window.dispatchEvent(new Event("resize")); }
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => { try { history.replaceState(null, "", "#" + b.dataset.lab); } catch (e) {} show(b.dataset.lab); }));
(function () { const h = (location.hash || "").slice(1); show(["asph", "eor", "vfm"].includes(h) ? h : "asph"); })();
</script>
